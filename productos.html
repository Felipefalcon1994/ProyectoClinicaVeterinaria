<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda y Farmacia | Veterinaria San Marcos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/estilos.css">
  <script src="js/app.js" defer></script>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

  <header class="sticky-top shadow-sm">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary-custom py-3">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-heart-pulse-fill text-warning"></i> San Marcos</a>
        <div class="ms-auto d-flex gap-3 align-items-center">
          <a class="text-white text-decoration-none" href="index.html">Inicio</a>
          <button class="btn btn-warning fw-bold text-dark" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasCarrito">
            <i class="bi bi-cart3"></i> Carrito (<span id="contador-carrito">0</span>)
          </button>
        </div>
      </div>
    </nav>
  </header>

  <main class="flex-grow-1 py-5">
    <div class="container">
      <h2 class="fw-bold text-primary-custom mb-4">Farmacia Veterinaria</h2>
      <!-- Contenedor donde JS inyectará los productos -->
      <div class="row g-4" id="contenedor-productos">
        <!-- Renderizado dinámico -->
      </div>
    </div>
  </main>

  <!-- Menú lateral (Offcanvas) para el Carrito -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasCarrito" aria-labelledby="offcanvasCarritoLabel">
    <div class="offcanvas-header bg-light">
      <h5 class="offcanvas-title fw-bold" id="offcanvasCarritoLabel">Mi carrito de compras</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column">
      <div id="items-carrito" class="flex-grow-1 overflow-auto mb-3">
        <!-- Ítems del carrito renderizados por JS -->
      </div>
      <div class="border-top pt-3">
        <h4 class="fw-bold d-flex justify-content-between">
          <span>TOTAL:</span>
          <span id="total-carrito">$0</span>
        </h4>
        <button class="btn btn-success w-100 fw-bold mt-2 py-2" id="btn-pagar">PAGAR</button>
      </div>
    </div>
  </div>

  <!-- SOLUCIÓN: Este es el script que faltaba para que el carrito se abra -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
