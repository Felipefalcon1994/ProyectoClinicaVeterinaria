<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Administrador | Veterinaria San Marcos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <nav class="navbar navbar-dark bg-dark py-3">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-heart-pulse-fill text-warning me-1"></i>
                    Veterinaria San Marcos <span class="text-warning fs-6"> ADMINISTRADOR</span>
            </a>
            <!--Boton para cierre de sesión-->
            <button class="btn btn-outline-warning btn-sm fw-bold" id="cerrar-sesion">
                <i class="bi bi-box-arrow-right me-1"></i> Salir
            </button>    
        </div>
    </nav>

    <main class="container py-4">
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body p-4">
                <h4 class="fw-bold text-primary-custom mb-3">Agregar Productos</h4>

                <form id="formulario-admin" novalidate>
                    <div class="row g-3">
                        <!--Ingresar nombre-->
                        <div class="col-12 col-md-4">
                            <label for="prod-name" class="form-label fw-semibold">Nombre del Producto *</label>
                            <input type="text" class="form-control" id="prod-name" placeholder="Ej: Amoxibay 250mg">
                            <div class="invalid-feedback" id="error-prod-name">Ingresa el nombre del producto.</div>
                        </div>
                        <!--Se Ingresa la categoria del producto-->
                        <div class="col-12 col-md-3">
                            <label for="prod-categoria" class="form-label fw-semibold">Categoría *</label>
                            <input type="text" class="form-control" id="prod-categoria" placeholder="Ej: Antibióticos">
                            <div class="invalid-feedback" id="error-prod-categoria">Ingresa la categoría.</div>
                        </div>
                        <!--Se ingresan los precios-->
                        <div class="col-12 col-md-2">
                            <label for="prod-precio" class="form-label fw-semibold">Precio (CLP) *</label>
                            <input type="text" class="form-control" id="prod-precio" inputmode="numeric" placeholder="Ingrese Precio">
                            <div class="invalid-feedback" id="error-prod-precio">Ingresa un precio mayor a 0.</div>
                        </div>
                        <!--BOTÓN PARA AGREGAR PRODUCTOS-->
                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-warning fw-bold text-dark px-4" id="btn-submit-admin">
                                <i class="bi bi-plus-circle me-1"></i> Agregar Producto
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
            <!--Lista de Productos Existentes-->
        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <h4 class="fw-bold text-primary-custom mb-3">Listado de Productos</h4>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                        <tr>
                            <th>Código</th>
                            <th>Producto</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                        </thead>
                        <!--Acá quedan los productos-->
                        <tbody id="tabla-productos">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Script específico del panel admin -->
  <script src="js/admin.js"></script>
</body>
</html>
